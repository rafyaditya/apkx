[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apkx"
version = "1.4.3"
description = "AI-Native Android Reverse Engineering, Exploration & Blueprint Engine"
readme = "README.md"
authors = [{ name = "Developer" }]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "click>=8.0.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "textual>=0.70.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "mypy==1.15.0",
    "build",
    "twine",
]

[project.scripts]
apkx = "apk_extractor.cli:app"

[tool.setuptools.packages.find]
include = ["apk_extractor*"]

[tool.setuptools.package-data]
"apk_extractor" = ["data/skills/apkx-android-blueprint/*.md"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["apk_extractor"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
