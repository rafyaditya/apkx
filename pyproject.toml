[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apkx"
version = "0.1.0"
description = "Fast, interactive CLI tool to pull and extract APKs (including Split APKs) from Android devices"
readme = "README.md"
authors = [{ name = "Developer" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "textual>=0.70.0",
]

[project.scripts]
apkx = "apk_extractor.cli:app"

[tool.setuptools.packages.find]
include = ["apk_extractor*"]
